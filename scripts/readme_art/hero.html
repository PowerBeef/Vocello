<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="art.css">
<style>
  :root { --w: 800px; --h: 616px; }
  .head { text-align: center; padding-top: 34px; }
  .brand { display: inline-flex; align-items: center; gap: 12px; }
  .brand img { width: 46px; height: 46px; }
  .brand span { font-size: 30px; font-weight: 600; letter-spacing: -0.3px; }
  h1 { margin-top: 18px; font-size: 25px; font-weight: 600; letter-spacing: -0.2px; }
  h1 em { font-style: normal; color: var(--accent); }
  .sub { margin-top: 8px; font-size: 14.5px; color: var(--fg-secondary); }
  .modes { margin-top: 18px; display: flex; gap: 10px; justify-content: center; }
  .mac { position: absolute; left: 92px; top: 236px; width: 520px; }
  .phone {
    position: absolute; left: 560px; top: 272px; width: 150px; padding: 5px;
    border-radius: 26px; background: #0A0B0E; border: 1px solid var(--stroke-card);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
  }
  .phone img { width: 100%; display: block; border-radius: 21px; }
</style></head>
<body>
  <div class="head">
    <div class="brand"><img src="../../Sources/Assets.xcassets/AppIcon.appiconset/icon_256x256.png" alt=""><span>Vocello</span></div>
    <h1>Premium voice studio. <em>Proven performance.</em> Private by design.</h1>
    <p class="sub">Write a script, pick or describe a voice, and generate speech locally on your Mac and iPhone.</p>
    <div class="modes">
      <span class="pill"><i class="dot custom"></i>Built-in Voice</span>
      <span class="pill"><i class="dot design"></i>Voice Design</span>
      <span class="pill"><i class="dot clone"></i>Voice Cloning</span>
    </div>
  </div>
  <img class="window mac" src="../../docs/screenshots/vocello-custom-voice.png" alt="">
  <div class="phone"><img src="../../docs/screenshots/vocello-ios-studio.png" alt=""></div>
</body></html>
