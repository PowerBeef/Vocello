name: Nightly

# The cold and complete passes behind push CI: a cold run of the Thread
# Sanitizer subset (push CI's macos-tsan job runs it on its warm cache and has
# blocked every Swift push since 2026-09-14, config/tsan-policy.json), the
# complete Python suite including quarantined tests, and cold foundation
# compiles of both platforms. Failure opens (or refreshes) one issue labelled
# `nightly`; this workflow itself blocks no commit or push, and no retry is
# automatic. The report-only jobs file no issue: coverage (line coverage of the
# watched engine files and the pinned Xcode's build-setting probe) and
# migration-warnings (what the migrate-mode strictness settings would flag).
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  tsan:
    name: Core TSan subset
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Native toolchain
        uses: ./.github/actions/native-toolchain
        with:
          metal: "true"

      - name: Run the Thread Sanitizer subset
        run: scripts/macos_test.sh tsan

      - name: Retain sanitizer evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tsan-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/artifacts/macos/tests/tsan-*/
          if-no-files-found: warn
          retention-days: 14

  python-full:
    name: Python suite (complete)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned numpy, pytest and ripgrep
        run: |
          set -euo pipefail
          NUMPY_PIN="$(python3 -c "import json; print(json.load(open('config/toolchain.json'))['native']['numpy']['version'])")"
          PYTEST_PIN="$(python3 -c "import json; print(json.load(open('config/toolchain.json'))['native']['pytest']['version'])")"
          XDIST_PIN="$(python3 -c "import json; print(json.load(open('config/toolchain.json'))['native']['pytest-xdist']['version'])")"
          python3 -m pip install --quiet --break-system-packages "numpy==${NUMPY_PIN}" "pytest==${PYTEST_PIN}" "pytest-xdist==${XDIST_PIN}"
          sudo apt-get install -y --no-install-recommends ripgrep

      - name: Run the complete Python suite
        run: python3 -m pytest -n auto

  foundation-cold:
    name: Cold foundation compile (macOS + iOS)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Native toolchain
        uses: ./.github/actions/native-toolchain

      - name: Regenerate Xcode project
        run: ./scripts/regenerate_project.sh --fast

      - name: Compile every foundation target from a clean tree
        run: ./scripts/build_foundation_targets.sh all

      - name: Compile the macOS app optimized (warnings are errors)
        env:
          QVOICE_FOUNDATION_SWIFT_OPTIMIZATION: "-O"
          QVOICE_FOUNDATION_SWIFT_COMPILATION_MODE: "wholemodule"
        run: ./scripts/build_foundation_targets.sh macos

      - name: Upload compile results on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundation-cold-artifacts
          path: build/artifacts/foundation/
          if-no-files-found: warn
          retention-days: 7

  coverage:
    # Report-only (audit P1-14): line coverage of the deterministic suites and which newer
    # build settings the pinned Xcode defines. It files no issue; coverage is never a verdict.
    name: Coverage and build-setting probe (report-only)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Native toolchain
        uses: ./.github/actions/native-toolchain

      - name: Probe the pinned Xcode's build settings
        run: python3 scripts/ci/probe_build_settings.py

      - name: Run the deterministic suites with coverage
        run: scripts/macos_test.sh test --coverage

      - name: Summarize coverage
        if: always()
        run: |
          report="$(ls -t build/artifacts/macos/tests/*/coverage.json 2>/dev/null | head -1)"
          if [ -n "$report" ]; then
            python3 scripts/ci/coverage_report.py "$report" --root "$PWD"
          else
            echo "no coverage.json was written" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  migration-warnings:
    # Report-only (audit E-04 and P2-6): what strict memory safety and the
    # NonisolatedNonsendingByDefault and InferIsolatedConformances upcoming features
    # would flag in their migrate mode, which only warns. The macOS app and
    # VocelloCoreTests compile once from a clean tree with warnings not treated as
    # errors; a setting the pinned Xcode's build-setting probe reports absent, or an
    # upcoming feature without a migrate mode, is skipped and named in the summary.
    # It files no issue; no count is a verdict.
    name: Migrate-mode strictness warnings (report-only)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Native toolchain
        uses: ./.github/actions/native-toolchain

      - name: Choose the migrate settings the pinned Xcode offers
        id: plan
        run: >-
          python3 scripts/ci/migration_warnings_report.py plan
          --output build/artifacts/foundation/migration-plan.json --github-output

      - name: Compile the macOS app and VocelloCoreTests with them
        if: steps.plan.outputs.settings != ''
        env:
          QVOICE_FOUNDATION_MIGRATION_SETTINGS: ${{ steps.plan.outputs.settings }}
        run: ./scripts/build_foundation_targets.sh macos

      - name: Summarize the migration warnings
        if: always()
        run: >-
          python3 scripts/ci/migration_warnings_report.py report
          build/artifacts/foundation/qwenvoice-macos-migration.log
          --plan build/artifacts/foundation/migration-plan.json --root "$PWD"
          --output build/artifacts/foundation/migration-report.md

      - name: Retain the migration log and report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: migration-warnings-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/artifacts/foundation/qwenvoice-macos-migration.log
            build/artifacts/foundation/migration-plan.json
            build/artifacts/foundation/migration-report.md
          if-no-files-found: warn
          retention-days: 14

  report:
    name: Open or refresh the nightly issue
    needs: [tsan, python-full, foundation-cold]
    if: failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: File one issue per open nightly failure
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: ${{ toJSON(needs) }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/ci/failure_issue.py --label nightly --title "Nightly lane failing" --heading "Nightly run failed"
