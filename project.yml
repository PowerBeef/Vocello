name: QwenVoice
options:
  bundleIdPrefix: com.qwenvoice
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true

# Single shippable config. There is no separate Debug config / DEBUG symbol —
# behavior-changing diagnostics require both the repository-owned
# VOCELLO_INTERNAL_DIAGNOSTICS build capability and the explicit
# QWENVOICE_DEBUG process gate. Local scripts add the capability;
# distribution builds omit it. scripts/build.sh builds this config -Onone for
# a fast local loop; scripts/release.sh builds it optimized for the DMG.
configs:
  Release: release

# One version identity for every generated target. The app targets used to pin
# these per-target; framework targets with GENERATE_INFOPLIST_FILE then inherited
# nothing, so their generated Info.plists carried an empty CFBundleShortVersionString
# and App Store Connect rejected the embedded frameworks (upload error 90057).
settings:
  base:
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    MARKETING_VERSION: "3.0.0"
    CURRENT_PROJECT_VERSION: "24"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    exactVersion: "7.10.0"
  MLXAudio:
    path: Packages/VocelloQwen3Core
  MLXSwift:
    url: https://github.com/ml-explore/mlx-swift.git
    exactVersion: "0.31.6"
  # No product target links the HuggingFace product (owned sources import no
  # HuggingFace module). The owned package depends on it; this exact pin moves in
  # lockstep with Packages/VocelloQwen3Core/Package.swift.
  SwiftHuggingFace:
    url: https://github.com/huggingface/swift-huggingface.git
    exactVersion: "0.9.0"

schemes:
  QwenVoice:
    build:
      targets:
        QwenVoice: all
    run:
      config: Release
    test:
      config: Release
      targets:
        - VocelloCoreTests
    profile:
      config: Release
    analyze:
      config: Release
    archive:
      config: Release

  VocelloiOS:
    build:
      targets:
        VocelloiOS: all
    run:
      config: Release
    test:
      config: Release
      targets: []
    profile:
      config: Release
    analyze:
      config: Release
    archive:
      config: Release

  VocelloMacUI:
    build:
      targets:
        QwenVoice: all
        VocelloMacUITests: [test]
    run:
      config: Release
    test:
      config: Release
      # Screenshots-only: Xcode's default automatic screen RECORDING spawns a
      # replayd/VTEncoder pipeline that video-encodes the display for the whole
      # run. On the 8 GB floor Mac that observer effect throttled engine RTF
      # from ~1.2 to 0.70-0.93 in every pre-2026-07-23 UI benchmark record.
      preferredScreenCaptureFormat: screenshots
      targets:
        - VocelloMacUITests
    profile:
      config: Release
    analyze:
      config: Release
    archive:
      config: Release

  VocelloiOSUI:
    build:
      targets:
        VocelloiOS: all
        VocelloiOSUITests: [test]
    run:
      config: Release
    test:
      config: Release
      # Same screenshots-only rationale as VocelloMacUI: on-device screen
      # recording competes with the in-process engine for the phone's SoC.
      preferredScreenCaptureFormat: screenshots
      targets:
        - VocelloiOSUITests
    profile:
      config: Release
    analyze:
      config: Release
    archive:
      config: Release

  VocelloiOSCandidateUI:
    build:
      targets:
        VocelloiOSCandidateUITests: [test]
    run:
      config: Release
    test:
      config: Release
      preferredScreenCaptureFormat: screenshots
      targets:
        - VocelloiOSCandidateUITests
    profile:
      config: Release
    analyze:
      config: Release
    archive:
      config: Release

targets:
  QwenVoice:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - "QwenVoiceCore"
          - "QwenVoiceCore/**"
          - "QwenVoiceBackendCore"
          - "QwenVoiceBackendCore/**"
          - "iOS"
          - "iOS/**"
          - "iOSSupport"
          - "iOSSupport/**"
          - "VocelloCLI"
          - "VocelloCLI/**"
          - "Resources/ffmpeg"
          - "Resources/ffmpeg/**"
          - "Resources/vendor"
          - "Resources/vendor/**"
          - "Resources/**/*.whl"
          - "Resources/**/__pycache__/**"
          - "Resources/**/*.pyc"
      # The iOS engine-hosting stack is the reference implementation (maintainer
      # decision 2026-09-14, plan macos-ios-convergence-2026-09): the macOS app
      # compiles these iOS files by path and hosts MLXTTSEngine in-process on the
      # same TTSEngineStore. The files keep their paths and their iOS behavior.
      - path: Sources/iOS/TTSEngineStore.swift
      - path: Sources/iOSSupport/Services/IOSGenerationOwnershipAuthority.swift
      - path: Sources/iOSSupport/Services/RuntimeReleaseCoordinator.swift
      # PA-15: StudioGenerationCoordinator carries the iOS foreground-exit notice state.
      - path: Sources/iOSSupport/Services/IOSBackgroundGenerationPolicy.swift
      - path: Sources/iOSSupport/Services/IOSDeviceDiagnosticsRecorder.swift
      - path: Sources/iOSSupport/Services/AppNotifications.swift
      - path: Sources/iOSSupport/Models/Generation.swift
      - path: Sources/iOSSupport/Services/DatabaseService.swift
      - path: Sources/iOSSupport/Models/Voice.swift
      - path: Sources/iOSSupport/ViewModels/SavedVoicesViewModel.swift
      - path: Sources/iOSSupport/Services/SavedVoicesBusyRetryPolicy.swift
      - path: Sources/iOSSupport/Services/IOSAppLanguage.swift
      - path: Sources/iOSSupport/Services/StudioGenerationAttemptAuthority.swift
      - path: Sources/iOSSupport/Services/IOSSingleTakeGenerationExecutor.swift
      - path: Sources/iOS/Studio/StudioGenerationCoordinator.swift
      - path: Sources/iOS/Studio/StudioGenerationItems.swift
      # CONV-22: long-form projects and the generation drafts are the iOS ones;
      # the long-form runner's platform side effects go through
      # MacStudioLongFormPlatformHooks (Sources/Services).
      - path: Sources/iOS/Studio/IOSLongFormProject.swift
      - path: Sources/iOSSupport/Models/GenerationDrafts.swift
      - path: Sources/iOSSupport/Models/PendingVoiceCloningHandoff.swift
    resources:
      - path: Sources/Resources
        buildPhase: resources
        excludes:
          - "ffmpeg"
          - "vendor"
          - "vendor/**"
          - "**/*.whl"
          - "**/__pycache__/**"
          - "**/*.pyc"
      - path: Sources/Assets.xcassets
        buildPhase: resources
      - path: Sources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qwenvoice.app
        PRODUCT_NAME: Vocello
        WRAPPER_NAME: Vocello.app
        # Keep the Swift module name as QwenVoice so sibling modules that assume
        # the QwenVoice namespace still resolve after the on-disk rename to Vocello.app.
        PRODUCT_MODULE_NAME: QwenVoice
        SWIFT_VERSION: "6"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        INFOPLIST_FILE: Sources/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Vocello
        INFOPLIST_KEY_QwenVoiceTeamIdentifier: $(QWENVOICE_DEVELOPMENT_TEAM)
        CODE_SIGN_ENTITLEMENTS: Sources/QwenVoice.entitlements
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: QW_UI_LIQUID
    dependencies:
      - package: GRDB
      - target: QwenVoiceCore
      - package: MLXAudio
        product: VocelloQwen3Core
      - package: MLXSwift
        product: MLX

  # Headless Swift CLI over the in-process engine (QwenVoiceCore). User-facing
  # generation without the UI + the deterministic driver for benchmarks/perf
  # tests. No Python backend, no bundled
  # weights — links the same engine frameworks as the apps.
  VocelloCLI:
    type: tool
    platform: macOS
    sources:
      - path: Sources/VocelloCLI
      # Bundle the contract beside the binary so the CLI resolves it via the
      # Bundle sweep in CLIRuntime.locateManifestURL — no longer dependent on
      # being run from the repo root. Uses the explicit resources buildPhase
      # (same shape as the iOS target / XcodeGen 2.45.4 gotcha) to be safe for
      # a non-app `tool` product.
      - path: Sources/Resources/qwenvoice_contract.json
        buildPhase: resources
      - path: Sources/Resources/qwenvoice_production_model_catalog.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qwenvoice.cli
        PRODUCT_NAME: vocello
        PRODUCT_MODULE_NAME: VocelloCLI
        SWIFT_VERSION: "6"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        # Command-line tools have no bundle Info.plist by default. Embed the
        # project-owned version settings in the Mach-O so Bundle.main and every
        # `vocello version` alias resolve the same product identity.
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        INFOPLIST_KEY_CFBundleShortVersionString: "$(MARKETING_VERSION)"
        INFOPLIST_KEY_CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Ad-hoc signed, no hardened runtime: a plain CLI runs Metal/MLX fine
        # without the app's allow-unsigned-memory entitlement.
        CODE_SIGN_IDENTITY: "-"
    dependencies:
      - target: QwenVoiceCore
      - package: MLXAudio
        product: VocelloQwen3Core
      - package: MLXSwift
        product: MLX

  QwenVoiceCore:
    type: framework.static
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Sources/QwenVoiceCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qwenvoice.core
        PRODUCT_NAME: QwenVoiceCore
        PRODUCT_MODULE_NAME: QwenVoiceCore
        SWIFT_VERSION: "6"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: Sources/QwenVoiceCore/QwenVoiceCore-Bridging-Header.h
        # Local scripts set only this user-defined value. Keeping the compile
        # condition on the one owned target that reads it avoids rebuilding
        # every Swift package dependency when diagnostics are enabled.
        OTHER_SWIFT_FLAGS: "$(inherited) $(QVOICE_INTERNAL_DIAGNOSTICS_SWIFT_FLAG)"
    dependencies:
      - target: QwenVoiceBackendCore
      - package: MLXAudio
        product: VocelloQwen3Core
      - package: MLXSwift
        product: MLX

  QwenVoiceBackendCore:
    type: framework.static
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Sources/QwenVoiceBackendCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qwenvoice.backend-core
        PRODUCT_NAME: QwenVoiceBackendCore
        PRODUCT_MODULE_NAME: QwenVoiceBackendCore
        SWIFT_VERSION: "6"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        GENERATE_INFOPLIST_FILE: YES
  VocelloiOS:
    type: application
    platform: iOS
    # XcodeGen 2.45.4 gotcha (see the iOS section of .claude/rules/native.md + commit
    # 287c969): the bundled resources below MUST be listed under `sources:` with an
    # explicit `buildPhase: resources` override. Listing them under `resources:`
    # silently drops them from the VocelloiOS Resources phase, so iOS builds compile
    # but crash on first launch with missing bundled resources. Do not "tidy" these
    # into the `resources:` block.
    sources:
      - path: Sources/iOS
        excludes:
          - InfoPlist.xcstrings
      - path: Sources/iOS/InfoPlist.xcstrings
        buildPhase: resources
      - path: Sources/iOSSupport
      - path: Sources/SharedSupport
      - path: Sources/Resources/qwenvoice_contract.json
        buildPhase: resources
      - path: Sources/Resources/qwenvoice_ios_model_catalog.json
        buildPhase: resources
      - path: Sources/Resources/qwenvoice_production_model_catalog.json
        buildPhase: resources
      - path: Sources/Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Sources/Resources/third_party_attributions.json
        buildPhase: resources
      - path: Sources/Resources/voice-previews
        buildPhase: resources
        # Per-voice preview WAVs (24 kHz mono Int16). Each file
        # is named after the speaker id from qwenvoice_contract.json. The voice
        # picker sheet plays them via IOSVoicePreviewPlayer when the
        # row's preview button is tapped. WAV bytes are generated by
        # running the macOS Vocello.app once per speaker — see
        # `Sources/iOS/Sheets/IOSVoicePreviewPlayer.swift` for the
        # bundle lookup convention.
      - path: Sources/Assets.xcassets
        buildPhase: resources
      - path: Sources/PrivacyInfo.xcprivacy
        buildPhase: resources
    resources:
      - path: Sources/iOS/LaunchScreen.storyboard
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.patricedery.vocello
        PRODUCT_NAME: Vocello
        PRODUCT_MODULE_NAME: QVoiceiOS
        EXECUTABLE_NAME: Vocello
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(QWENVOICE_DEVELOPMENT_TEAM)
        QVOICE_IOS_APP_GROUP_IDENTIFIER: group.com.patricedery.vocello.shared
        # Override at build time for App Store archive/export, e.g.
        # QVOICE_IOS_APP_ENTITLEMENTS=Sources/iOS/VocelloiOSRelease.entitlements
        QVOICE_IOS_APP_ENTITLEMENTS: Sources/iOS/VocelloiOS.entitlements
        QVOICE_IOS_DEFAULT_MODEL_CATALOG_URL: "bundle://vocello/ios/catalog/v1/models.json"
        INFOPLIST_KEY_QVoiceModelCatalogURL: $(QVOICE_IOS_DEFAULT_MODEL_CATALOG_URL)
        INFOPLIST_KEY_QVoiceSharedAppGroupIdentifier: $(QVOICE_IOS_APP_GROUP_IDENTIFIER)
        INFOPLIST_KEY_CFBundleDisplayName: Vocello
        SWIFT_VERSION: "6"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: $(QVOICE_IOS_APP_ENTITLEMENTS)
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        ASSETCATALOG_COMPILER_APPICON_NAME: VocelloIOSIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1"
        # Device diagnostics live in the app target. Do not pass their compile
        # condition through global OTHER_SWIFT_FLAGS; that invalidates the
        # complete package graph before every focused device run.
        OTHER_SWIFT_FLAGS: "$(inherited) $(QVOICE_DEVICE_DIAGNOSTICS_SWIFT_FLAG)"
    dependencies:
      - package: GRDB
      - target: QwenVoiceCore
      - package: MLXAudio
        product: VocelloQwen3Core
      - package: MLXSwift
        product: MLX

  # Pure logic unit tests for QwenVoiceCore language/model-delivery semantics and
  # platform-neutral iOS policies (no models, no network, no Simulator, no XPC).
  # The iOS policy sources/tests are also compiled in the standalone device-SDK
  # target below; hosting them here makes their assertions execute in ordinary
  # macOS deterministic CI.
  # Run: scripts/macos_test.sh core-test
  VocelloCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Sources/Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Tests/Fixtures/VocelloExports.storekit
        buildPhase: resources
      - path: Tests/VocelloCoreTests
      - path: Tests/UIAutomationSupport/VocelloUIInteractionPolicy.swift
      - path: Tests/UIAutomationSupport/VocelloPlaybackCaptureSupport.swift
      - path: Tests/VocelloiOSLogicTests
      - path: Sources/SharedSupport/Services/AudioPlaybackResumePolicy.swift
      - path: Sources/SharedSupport/Services/LanguageSelectionPresentation.swift
      - path: Sources/SharedSupport/Services/GenerationOutputVerifier.swift
      - path: Sources/SharedSupport/Services/VoiceClipTranscriber.swift
      - path: Sources/SharedSupport/Telemetry/MainThreadStallWatchdog.swift
      - path: Sources/SharedSupport/Database/HistoryPersistenceError.swift
      - path: Sources/SharedSupport/Database/GenerationMigrations.swift
      - path: Sources/SharedSupport/Database/GenerationHistoryOutbox.swift
      - path: Sources/SharedSupport/Database/LongFormHistoryAcceptance.swift
      - path: Sources/SharedSupport/Database/GenerationHistoryEnqueueState.swift
      # AUD-05: the bounded History page query, run against real SQLite.
      - path: Sources/SharedSupport/Database/GenerationHistoryPage.swift
      - path: Sources/SharedSupport/Services/VocelloPresentationText.swift
      - path: Sources/SharedSupport/Services/VocelloLocalization.swift
      # The scale's tables, so MacTypeScaleTests can hold their shape: six type
      # steps over thirteen roles, six control steps, ordered stroke and
      # opacity. These are pure value tables with no view dependency.
      - path: Sources/SharedSupport/Theme/VocelloThemeTokens.swift
      - path: Sources/SharedSupport/Theme/VocelloTypography.swift
      - path: Sources/Views/Theme/MacTypeScale.swift
      - path: Sources/Views/Theme/MacControlMetrics.swift
      # The chip row's arithmetic, so MacChipFlowTests can hold the invariant
      # that a row never hands out more width than it has. Pure CoreGraphics,
      # no view dependency.
      - path: Sources/Views/Studio/MacChipRowBudget.swift
      # The transcript's conditioning normalisation, so the whitespace collapse
      # that changed what reaches the model is covered. Pure Foundation.
      - path: Sources/Models/TranscriptNormalization.swift
      - path: Sources/iOSSupport/Services/IOSAppLanguage.swift
      - path: Sources/iOS/Commerce/IOSCommercePresentationText.swift
      - path: Sources/iOS/Commerce/IOSStoreKitClient.swift
      - path: Sources/iOSSupport/Services/IOSCommerceErrorDiagnostics.swift
      - path: Sources/iOSSupport/Services/IOSSettingsModelNavigation.swift
      - path: Sources/Services/MacFileSaveCopy.swift
      - path: Sources/Services/MacStudioGenerationRequestFactory.swift
      - path: Sources/Services/MacLineBatchRequest.swift
      - path: Sources/Services/MacModelVariantResolution.swift
      - path: Sources/Services/LongTextGenerationRouter.swift
      - path: Sources/Models/ScriptTextState.swift
      - path: Sources/Services/MacInterfaceText.swift
      - path: Sources/Services/MacInterfaceLanguage.swift
      - path: Sources/VocelloCLI/CLIProcessSupervisor.swift
      - path: Sources/VocelloCLI/CLIBatchExecution.swift
      # PA-17: the CLI's consent recording, its bare-flag parsing (Support.swift)
      # and the CLIRuntime generate/enroll wrappers, so the refusal is unit-tested
      # at the engine call around an uninitialized engine.
      - path: Sources/VocelloCLI/CLIVoiceCloningConsent.swift
      - path: Sources/VocelloCLI/Support.swift
      - path: Sources/VocelloCLI/CLIRuntime.swift
      - path: Sources/iOSSupport/Models/Generation.swift
      - path: Sources/iOSSupport/Models/PendingVoiceCloningHandoff.swift
      - path: Sources/iOSSupport/Models/IOSStartupReliabilityRecord.swift
      - path: Sources/iOSSupport/Services/AppPaths.swift
      - path: Sources/iOSSupport/Services/IOSModelDeliverySupport.swift
      - path: Sources/iOSSupport/Services/IOSModelProgressPresentation.swift
      - path: Sources/iOSSupport/Services/IOSReferenceAudioImportPolicy.swift
      - path: Sources/iOSSupport/Services/IOSPullableDiagnosticsMirror.swift
      - path: Sources/SharedSupport/Services/ReferenceTranscriptionReviewState.swift
      - path: Sources/SharedSupport/Services/VoiceDesignBriefCatalog.swift
      - path: Sources/SharedSupport/Services/GenerationTextLimitPolicy.swift
      - path: Sources/SharedSupport/Services/WordTimingPlanner.swift
      - path: Sources/iOSSupport/Services/RuntimeReleaseCoordinator.swift
      - path: Sources/iOSSupport/Services/IOSBackgroundGenerationPolicy.swift
      - path: Sources/iOSSupport/Services/StudioGenerationAttemptAuthority.swift
      - path: Sources/iOSSupport/Services/IOSSingleTakeGenerationExecutor.swift
      - path: Sources/iOSSupport/Services/IOSGenerationOwnershipAuthority.swift
      - path: Sources/iOSSupport/Services/IOSModelDownloadCancellationSequence.swift
      - path: Sources/iOSSupport/Services/IOSStorageProtectionPolicy.swift
      - path: Sources/iOSSupport/Services/IOSDeviceEligibilityPolicy.swift
      - path: Sources/iOSSupport/Services/IOSExportAccessPolicy.swift
      - path: Sources/iOSSupport/Services/IOSExportPurchaseState.swift
      - path: Sources/iOSSupport/Services/IOSSavedOutputsDestination.swift
      - path: Sources/iOSSupport/Services/SavedVoicesBusyRetryPolicy.swift
      # PA-21: the one iOS audio-session owner's decision table.
      - path: Sources/iOSSupport/Services/IOSAudioSessionPolicy.swift
      # PA-21: Studio drafts kept across launches (IOS-09).
      - path: Sources/iOSSupport/Services/IOSStudioDraftPersistence.swift
    dependencies:
      - target: QwenVoiceCore
      - package: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qwenvoice.core.tests
        PRODUCT_NAME: VocelloCoreTests
        PRODUCT_MODULE_NAME: VocelloCoreTests
        SWIFT_VERSION: "6"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES

  # Deterministic iOS policy compilation. This deliberately has no application
  # host and no hidden app behavior. CI compiles it for generic/platform=iOS;
  # the same Foundation-level sources and assertions execute in VocelloCoreTests
  # on the macOS host.
  # Xcode 26 cannot execute a tool-hosted, app-host-free XCTest bundle on a
  # physical-device destination, so this target is intentionally compile-only.
  VocelloiOSLogicTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Sources/Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Tests/Fixtures/VocelloExports.storekit
        buildPhase: resources
      - path: Tests/VocelloiOSLogicTests
      - path: Sources/iOSSupport/Models/PendingVoiceCloningHandoff.swift
      - path: Sources/iOSSupport/Models/IOSStartupReliabilityRecord.swift
      - path: Sources/iOSSupport/Services/AppPaths.swift
      - path: Sources/iOSSupport/Services/IOSModelDeliverySupport.swift
      - path: Sources/iOSSupport/Services/IOSModelProgressPresentation.swift
      - path: Sources/iOSSupport/Services/IOSReferenceAudioImportPolicy.swift
      - path: Sources/iOSSupport/Services/IOSPullableDiagnosticsMirror.swift
      - path: Sources/SharedSupport/Services/ReferenceTranscriptionReviewState.swift
      - path: Sources/iOSSupport/Services/RuntimeReleaseCoordinator.swift
      - path: Sources/iOSSupport/Services/IOSBackgroundGenerationPolicy.swift
      - path: Sources/iOSSupport/Services/StudioGenerationAttemptAuthority.swift
      - path: Sources/iOSSupport/Services/IOSSingleTakeGenerationExecutor.swift
      - path: Sources/iOSSupport/Services/IOSGenerationOwnershipAuthority.swift
      - path: Sources/iOSSupport/Services/IOSModelDownloadCancellationSequence.swift
      - path: Sources/iOSSupport/Services/IOSStorageProtectionPolicy.swift
      - path: Sources/iOSSupport/Services/IOSDeviceEligibilityPolicy.swift
      - path: Sources/iOSSupport/Services/IOSExportAccessPolicy.swift
      - path: Sources/iOSSupport/Services/IOSExportPurchaseState.swift
      - path: Sources/iOSSupport/Services/IOSSavedOutputsDestination.swift
      - path: Sources/SharedSupport/Services/VocelloPresentationText.swift
      - path: Sources/SharedSupport/Services/VocelloLocalization.swift
      - path: Sources/iOSSupport/Services/IOSAppLanguage.swift
      - path: Sources/iOS/Commerce/IOSCommercePresentationText.swift
      - path: Sources/iOS/Commerce/IOSStoreKitClient.swift
      - path: Sources/iOSSupport/Services/IOSCommerceErrorDiagnostics.swift
      - path: Sources/iOSSupport/Services/SavedVoicesBusyRetryPolicy.swift
      # PA-21: the one iOS audio-session owner's decision table.
      - path: Sources/iOSSupport/Services/IOSAudioSessionPolicy.swift
      # PA-21: Studio drafts kept across launches (IOS-09).
      - path: Sources/iOSSupport/Services/IOSStudioDraftPersistence.swift
    dependencies:
      - target: QwenVoiceCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.patricedery.vocello.logic-tests
        PRODUCT_NAME: VocelloiOSLogicTests
        PRODUCT_MODULE_NAME: VocelloiOSLogicTests
        SWIFT_VERSION: "6"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(QWENVOICE_DEVELOPMENT_TEAM)
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO

  VocelloMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/UIAutomationSupport
      - path: Tests/VocelloMacUITests
    dependencies:
      - target: QwenVoice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qwenvoice.app.uitests
        PRODUCT_NAME: VocelloMacUITests
        PRODUCT_MODULE_NAME: VocelloMacUITests
        TEST_TARGET_NAME: QwenVoice
        SWIFT_VERSION: "6"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        CODE_SIGN_IDENTITY: "-"
        SWIFT_STRICT_CONCURRENCY: complete
    # Played-audio capture (PC-01): the runner taps the app's own output during
    # benchmark takes. Xcode copies the test bundle's usage strings into the
    # generated VocelloMacUITests-Runner.app, whose bundle id is
    # com.qwenvoice.app.uitests.xctrunner; macOS asks once for System Audio Recording.
    info:
      path: Tests/VocelloMacUITests/Info.plist
      properties:
        NSAudioCaptureUsageDescription: "The Vocello UI benchmark records the audio the app renders, as evidence."

  # Explicit physical-device iPhone UI automation. Simulator destinations are
  # unsupported; scripts/ui_test.sh resolves and signs for the paired phone.
  VocelloiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UIAutomationSupport
      - path: Tests/Fixtures/VocelloExports.storekit
        buildPhase: resources
      - path: Tests/VocelloiOSUITests
        excludes:
          - VocelloiOSCandidateAcceptanceUITests.swift
    dependencies:
      - target: VocelloiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.patricedery.vocello.uitests
        PRODUCT_NAME: VocelloiOSUITests
        PRODUCT_MODULE_NAME: VocelloiOSUITests
        TEST_TARGET_NAME: VocelloiOS
        SWIFT_VERSION: "6"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(QWENVOICE_DEVELOPMENT_TEAM)
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SWIFT_STRICT_CONCURRENCY: complete
        # This bundle imports StoreKitTest, whose Apple headers deprecate their
        # own API; with warnings as errors the clang module fails to build, so
        # the test bundle (never shipped) keeps warnings visible instead.
        SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

  # Standalone runner for an already installed distribution app. Deliberately
  # no VocelloiOS dependency or TEST_TARGET_NAME: it must not build the app.
  VocelloiOSCandidateUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UIAutomationSupport
      - path: Tests/VocelloiOSUITests/VocelloiOSCandidateAcceptanceUITests.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.patricedery.vocello.candidateuitests
        PRODUCT_NAME: VocelloiOSCandidateUITests
        PRODUCT_MODULE_NAME: VocelloiOSCandidateUITests
        SWIFT_VERSION: "6"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(QWENVOICE_DEVELOPMENT_TEAM)
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SWIFT_STRICT_CONCURRENCY: complete
