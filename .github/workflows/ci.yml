name: CI

# Push CI for Vocello (QwenVoice). Trunk-based: every push to main runs here and
# `CI required` is the single branch-protection context (skipped counts as pass).
#
# Pull requests (Dependabot and outside contributors; own work goes straight to
# main) run only the Linux lanes, contracts, Python and website, with the
# workflow's read-only token and no secrets (PA-23). `pull_request`, never
# `pull_request_target`: the PR's code never runs with a write token. Every
# macOS job is skipped on a PR; the push to main after merging runs them.
#
# Lanes are routed by scripts/ci/classify_changes.py; an unknowable diff runs
# everything. Native jobs restore the persistent DerivedData caches the local
# scripts already use (config/build-output-policy.json), so a warm push
# recompiles only what changed. Dispatch with `cold: true` to skip the restore.
#
# Ordinary CI executes no UI: it compiles the XCUITest bundles
# (build_ui_test_bundles.sh --gate, build-for-testing only) but never runs them,
# and uses no Simulator, no device and no model.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      cold:
        description: Skip the DerivedData cache restore (full rebuild)
        type: boolean
        default: false

permissions:
  contents: read

# One group per event and ref: a superseded push cancels the previous push run,
# but a manual measurement dispatch never cancels the gate run for a commit
# (MV-03: run 34773187624 was cancelled by a dispatch and CI required went red).
# A pull request's ref is refs/pull/<n>/merge, so a new PR push cancels only
# that PR's previous run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Change routing
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      swift: ${{ steps.classify.outputs.swift }}
      ios: ${{ steps.classify.outputs.ios }}
      python: ${{ steps.classify.outputs.python }}
      research: ${{ steps.classify.outputs.research }}
      website: ${{ steps.classify.outputs.website }}
      workflows: ${{ steps.classify.outputs.workflows }}
      macos_ui: ${{ steps.classify.outputs.macos_ui }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Each lane is diffed against the last run on this branch in which its job
      # passed, so a run cancelled by a superseding push cannot leave a lane
      # unrun behind a later docs-only push. With no earlier run the classifier
      # diffs against the previous push; when the history cannot be read, every
      # lane runs.
      - name: Recent runs of this workflow on this branch
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > ci-history.json
          # Pull-request runs skip every native job, so they never prove a lane
          # (a fork PR's head branch may itself be named main).
          # A failed fetch is not an empty history: it leaves a marker that makes
          # every lane run, never a green run that skipped lanes on a guessed base.
          if ! ids="$(gh run list --workflow ci.yml --branch "$GITHUB_REF_NAME" --limit 15 \
            --json databaseId,status,event \
            --jq '.[] | select(.status == "completed" and .event != "pull_request") | .databaseId')"; then
            echo '{"unavailable": true}' > ci-history.json
            echo "::warning::CI run history is unavailable; every lane runs"
            exit 0
          fi
          python3 - $ids <<'PY' > ci-history.json
          import json, subprocess, sys
          runs = []
          for run_id in sys.argv[1:]:
              view = subprocess.run(
                  ["gh", "run", "view", run_id, "--json", "headSha,conclusion,event,jobs"],
                  capture_output=True, text=True, check=False,
              )
              if view.returncode:
                  # A run that cannot be read is a gap, not an absence: an
                  # empty history would route on the previous push alone.
                  json.dump({"unavailable": True}, sys.stdout)
                  print("::warning::a CI run could not be read; every lane runs", file=sys.stderr)
                  raise SystemExit(0)
              payload = json.loads(view.stdout)
              runs.append({
                  "headSha": payload.get("headSha"),
                  "conclusion": payload.get("conclusion"),
                  "event": payload.get("event"),
                  "jobs": {job.get("name"): job.get("conclusion") for job in payload.get("jobs", [])},
              })
          json.dump(runs, sys.stdout)
          PY
          echo "history: $(python3 -c 'import json; h = json.load(open("ci-history.json")); print(len(h) if isinstance(h, list) else "unavailable,")' 2>/dev/null || echo 0) completed run(s)"

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          # Pull requests only: the base the merge commit (HEAD_SHA) is diffed against.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          CI_HISTORY_PATH: ci-history.json
        run: python3 scripts/ci/classify_changes.py

  contracts:
    name: Repository contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # roadmap.py resolves evidence commits against history.
          fetch-depth: 0
          persist-credentials: false

      - name: Install ripgrep and the pinned numpy
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends ripgrep
          NUMPY_PIN="$(python3 -c "import json; print(json.load(open('config/toolchain.json'))['native']['numpy']['version'])")"
          python3 -m pip install --quiet --break-system-packages "numpy==${NUMPY_PIN}"

      # First and on its own, so a Dependabot action bump names its fix in the
      # failing step: the workflow SHAs moved and config/toolchain.json must move
      # in the same PR (`supply_chain_contract.py --sync-actions` on its branch).
      - name: Action pins match config/toolchain.json
        run: python3 scripts/supply_chain_contract.py

      # The complete deterministic contract gate runs here on every push (MV-04):
      # product contracts, invariants, privacy scan, work authority and benchmark
      # history. None of it needs a Mac, so config/ and scripts/ changes no longer
      # route to the macOS lane.
      - name: Contract gate
        run: ./scripts/check_project_inputs.sh --python none

      # Static analysis over the whole tree (DW-02 and DW-03, audit P1-7, P1-8 and P2-6), run even
      # when the contract gate failed so one push names every finding. shellcheck at the local
      # lint's severity, ruff's syntax and pyflakes rules (ruff.toml) and SwiftLint's .swiftlint.yml
      # rules over the tracked Swift files it covers, all SHA-pinned in config/toolchain.json (the
      # static Linux SwiftLint needs no Swift toolchain: none of its rules uses SourceKit). Only a
      # finding absent from config/lint-baseline/<tool>.json fails; a baseline only shrinks
      # (`python3 scripts/lint_baseline.py <tool> --update`).
      - name: Install the pinned shellcheck, ruff and SwiftLint
        id: lint-tools
        if: ${{ !cancelled() }}
        run: ./scripts/install_pinned_tools.sh shellcheck-linux-x86_64 ruff-linux-x86_64 swiftlint-linux-x86_64

      - name: shellcheck fails on new findings
        if: ${{ !cancelled() && steps.lint-tools.outcome == 'success' }}
        run: python3 scripts/lint_baseline.py shellcheck

      - name: ruff fails on new findings
        if: ${{ !cancelled() && steps.lint-tools.outcome == 'success' }}
        run: python3 scripts/lint_baseline.py ruff

      - name: SwiftLint fails on new findings
        if: ${{ !cancelled() && steps.lint-tools.outcome == 'success' }}
        run: python3 scripts/lint_baseline.py swiftlint

      # Pyright (DW-04, audit P3-4) in pyrightconfig.json's basic mode over the tracked scripts,
      # against an empty interpreter so the findings never depend on installed packages; its
      # npm version is pinned in config/toolchain.json `npmPins`.
      - name: Select Node 24 for Pyright
        if: ${{ !cancelled() }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install the pinned Pyright
        id: pyright
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          PYRIGHT_PIN="$(python3 -c "import json; print(json.load(open('config/toolchain.json'))['npmPins']['pyright']['version'])")"
          npm install --global --no-audit --no-fund "pyright@${PYRIGHT_PIN}"

      - name: Pyright fails on new findings
        if: ${{ !cancelled() && steps.pyright.outcome == 'success' }}
        run: python3 scripts/lint_baseline.py pyright

  # The Python suite on Linux, every module included: the benchmark publisher's
  # host probes are mocked in its tests, so nothing here needs the macOS host.
  python:
    name: Python tests (linux)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned numpy, pytest and ripgrep
        run: |
          set -euo pipefail
          NUMPY_PIN="$(python3 -c "import json; print(json.load(open('config/toolchain.json'))['native']['numpy']['version'])")"
          PYTEST_PIN="$(python3 -c "import json; print(json.load(open('config/toolchain.json'))['native']['pytest']['version'])")"
          XDIST_PIN="$(python3 -c "import json; print(json.load(open('config/toolchain.json'))['native']['pytest-xdist']['version'])")"
          python3 -m pip install --quiet --break-system-packages "numpy==${NUMPY_PIN}" "pytest==${PYTEST_PIN}" "pytest-xdist==${XDIST_PIN}"
          sudo apt-get install -y --no-install-recommends ripgrep

      - name: Product and tooling tests
        env:
          VOCELLO_QUARANTINE: "1"
        run: python3 -m pytest -n auto -m "not research"

      - name: Research tooling tests
        if: needs.changes.outputs.research == 'true' || needs.changes.outputs.workflows == 'true'
        env:
          VOCELLO_QUARANTINE: "1"
        run: python3 -m pytest -n auto -m research

  macos-tests:
    name: macOS deterministic tests
    needs: changes
    # Never on a pull request (PA-23): the Linux lanes gate PRs, main gates the Mac.
    # A change only to the macOS XCUITest sources (macos_ui without swift, PA-06)
    # runs this job for the bundle compile alone: the deterministic steps below
    # and the TSan job have nothing of it to prove.
    if: github.event_name != 'pull_request' && (needs.changes.outputs.swift == 'true' || needs.changes.outputs.macos_ui == 'true')
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Native toolchain
        uses: ./.github/actions/native-toolchain

      - name: Compute cache key
        id: key
        run: |
          # The Xcode segment comes from config/toolchain.json so a pin bump starts a new cache namespace.
          xcode="$(python3 -c "import json; print(json.load(open('config/toolchain.json'))['native']['xcode']['version'])")"
          # The dependency graph only: project.yml churns daily and is regenerated each run, so
          # keying on it split one week into several cold namespaces (audit W-04).
          graph="${{ hashFiles('QwenVoice.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Packages/VocelloQwen3Core/Package.resolved', 'Packages/VocelloQwen3Core/Package.swift') }}"
          # Every key is unique, so restore always takes the newest entry of this week, then of
          # this graph, then of this Xcode. A run saves a new snapshot when nothing of this week
          # was restored or when it recompiled more than 200 files (see "Save build caches").
          week="$(date -u +%G-W%V)"
          echo "prefix=macos-xcode${xcode}-" >> "$GITHUB_OUTPUT"
          echo "graph=macos-xcode${xcode}-${graph}-" >> "$GITHUB_OUTPUT"
          echo "week=macos-xcode${xcode}-${graph}-${week}-" >> "$GITHUB_OUTPUT"
          echo "value=macos-xcode${xcode}-${graph}-${week}-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
          echo "spm=spm-${{ hashFiles('QwenVoice.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Packages/VocelloQwen3Core/Package.resolved') }}" >> "$GITHUB_OUTPUT"

      - name: Restore build caches
        id: cache
        if: ${{ !inputs.cold }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/cache/xcode/macos
            build/cache/swiftpm/mlx-audio-runtime
          key: ${{ steps.key.outputs.value }}
          restore-keys: |
            ${{ steps.key.outputs.week }}
            ${{ steps.key.outputs.graph }}
            ${{ steps.key.outputs.prefix }}

      - name: Restore the shared package checkout
        id: spm
        if: ${{ !inputs.cold }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/cache/xcode/source-packages
          key: ${{ steps.key.outputs.spm }}

      - name: Restore tracked-file mtimes from history
        run: python3 scripts/ci/restore_mtimes.py

      - name: Regenerate Xcode project
        run: ./scripts/regenerate_project.sh --fast

      - name: Run deterministic macOS tests
        if: needs.changes.outputs.swift == 'true'
        env:
          VOCELLO_QUARANTINE: "1"
          QVOICE_BUILD_TIMING_SUMMARY: "1"
          # Report-only (audit P1-5): about 5 s on the core bundle; violations are counted below.
          QVOICE_MAIN_THREAD_CHECKER: "1"
        run: |
          set -o pipefail
          scripts/macos_test.sh test 2>&1 | tee "$RUNNER_TEMP/deterministic.log"

      - name: Report Main Thread Checker findings
        if: always() && needs.changes.outputs.swift == 'true'
        run: |
          count="$(cat build/artifacts/macos/tests/*/core.main-thread-checker.txt 2>/dev/null | tail -1)"
          echo "Main Thread Checker: ${count:-not run} violation(s) in VocelloCoreTests (report-only)"
          if [ "${count:-0}" != "0" ]; then
            echo "::warning title=Main Thread Checker::${count} violation(s); see core.log in the test artifacts"
          fi

      - name: Measure cache drift
        id: drift
        if: always()
        run: |
          compiled="$(grep -o 'test bundles built: [0-9]*' "$RUNNER_TEMP/deterministic.log" 2>/dev/null | grep -o '[0-9]*$' | tail -1 || true)"
          echo "compiled=${compiled:-0}" >> "$GITHUB_OUTPUT"
          echo "recompiled ${compiled:-0} Swift file(s); a new snapshot is saved above 200"

      - name: Verify source-built CLI version identity
        if: needs.changes.outputs.swift == 'true'
        run: ./scripts/build.sh cli --version

      - name: Compile the macOS XCUITest bundle (build only, never run)
        # PA-24: build-for-testing in the arena the deterministic build just
        # warmed, with its settings, so only the UI-test target compiles. On a
        # UI-test-only push (PA-06) the deterministic build is skipped and this
        # also brings the app host current in the restored arena, with the same
        # settings. No runner is launched; repo_invariants.sh check 2 forbids
        # executing it.
        run: ./scripts/build_ui_test_bundles.sh macos --gate

      - name: Name the failing tests
        if: failure()
        run: python3 scripts/ci/summarize_test_failures.py --lane "macOS deterministic tests" --root build/artifacts

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-deterministic-test-artifacts
          path: |
            build/artifacts/macos/tests/
            build/artifacts/ui-bundles/
          if-no-files-found: warn
          retention-days: 7

      - name: Prune caches before save
        if: always()
        run: |
          rm -rf build/cache/xcode/macos/Logs build/cache/xcode/macos/Index.noindex
          find build/cache/xcode/macos -name '*.xcactivitylog' -delete 2>/dev/null || true
          du -sh build/cache/xcode/macos build/cache/xcode/source-packages build/cache/swiftpm/mlx-audio-runtime 2>/dev/null || true
          echo "restored from: ${{ steps.cache.outputs.cache-matched-key || 'nothing (cold)' }}"

      - name: Save build caches
        # Saves when nothing of this week was restored (the first run of a week or of a new
        # graph, or a cold dispatch) or when the restored snapshot had drifted so far that this
        # run recompiled more than 200 files, and only after every step passed (CI-11): a
        # failed or partial build never becomes a snapshot. A warm, current run saves nothing.
        if: ${{ success() && (!startsWith(steps.cache.outputs.cache-matched-key, steps.key.outputs.week) || fromJSON(steps.drift.outputs.compiled || '0') > 200) }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/cache/xcode/macos
            build/cache/swiftpm/mlx-audio-runtime
          key: ${{ steps.key.outputs.value }}

      - name: Save the shared package checkout
        if: ${{ success() && steps.spm.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/cache/xcode/source-packages
          key: ${{ steps.key.outputs.spm }}

  macos-tsan:
    # Blocking since 2026-09-14 (config/tsan-policy.json): the deterministic core
    # subset under ThreadSanitizer, routed with the Swift lane. The nightly keeps
    # its cold run of the same lane.
    name: macOS ThreadSanitizer subset
    needs: changes
    if: github.event_name != 'pull_request' && needs.changes.outputs.swift == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Native toolchain
        uses: ./.github/actions/native-toolchain
        with:
          metal: "true"

      - name: Compute cache key
        id: key
        run: |
          xcode="$(python3 -c "import json; print(json.load(open('config/toolchain.json'))['native']['xcode']['version'])")"
          # Same scheme as macos-tests: dependency graph only, unique keys, drift-triggered saves.
          graph="${{ hashFiles('QwenVoice.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Packages/VocelloQwen3Core/Package.resolved', 'Packages/VocelloQwen3Core/Package.swift') }}"
          week="$(date -u +%G-W%V)"
          echo "prefix=macos-tsan-xcode${xcode}-" >> "$GITHUB_OUTPUT"
          echo "graph=macos-tsan-xcode${xcode}-${graph}-" >> "$GITHUB_OUTPUT"
          echo "week=macos-tsan-xcode${xcode}-${graph}-${week}-" >> "$GITHUB_OUTPUT"
          echo "value=macos-tsan-xcode${xcode}-${graph}-${week}-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
          echo "spm=spm-${{ hashFiles('QwenVoice.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Packages/VocelloQwen3Core/Package.resolved') }}" >> "$GITHUB_OUTPUT"

      - name: Restore the sanitizer build cache
        id: cache
        if: ${{ !inputs.cold }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/cache/xcode/macos-tsan
          key: ${{ steps.key.outputs.value }}
          restore-keys: |
            ${{ steps.key.outputs.week }}
            ${{ steps.key.outputs.graph }}
            ${{ steps.key.outputs.prefix }}

      - name: Restore the shared package checkout
        id: spm
        if: ${{ !inputs.cold }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/cache/xcode/source-packages
          key: ${{ steps.key.outputs.spm }}

      - name: Restore tracked-file mtimes from history
        run: python3 scripts/ci/restore_mtimes.py

      - name: Regenerate Xcode project
        run: ./scripts/regenerate_project.sh --fast

      - name: Run the Thread Sanitizer subset
        env:
          QVOICE_BUILD_TIMING_SUMMARY: "1"
        run: |
          set -o pipefail
          scripts/macos_test.sh tsan 2>&1 | tee "$RUNNER_TEMP/tsan.log"

      - name: Measure cache drift
        id: drift
        if: always()
        run: |
          compiled="$(grep -o 'test bundles built: [0-9]*' "$RUNNER_TEMP/tsan.log" 2>/dev/null | grep -o '[0-9]*$' | tail -1 || true)"
          echo "compiled=${compiled:-0}" >> "$GITHUB_OUTPUT"
          echo "recompiled ${compiled:-0} Swift file(s); a new snapshot is saved above 200"

      - name: Name the failing tests
        if: failure()
        run: python3 scripts/ci/summarize_test_failures.py --lane "macOS ThreadSanitizer subset"

      - name: Retain sanitizer evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tsan-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/artifacts/macos/tests/tsan-*/
          if-no-files-found: warn
          retention-days: 14

      - name: Prune the sanitizer cache before save
        if: always()
        run: |
          rm -rf build/cache/xcode/macos-tsan/Logs build/cache/xcode/macos-tsan/Index.noindex
          find build/cache/xcode/macos-tsan -name '*.xcactivitylog' -delete 2>/dev/null || true
          du -sh build/cache/xcode/macos-tsan 2>/dev/null || true
          echo "restored from: ${{ steps.cache.outputs.cache-matched-key || 'nothing (cold)' }}"

      - name: Save the sanitizer build cache
        if: ${{ success() && (!startsWith(steps.cache.outputs.cache-matched-key, steps.key.outputs.week) || fromJSON(steps.drift.outputs.compiled || '0') > 200) }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/cache/xcode/macos-tsan
          key: ${{ steps.key.outputs.value }}

  ios-compile:
    name: iOS compile check (device SDK)
    needs: changes
    if: github.event_name != 'pull_request' && needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Native toolchain
        uses: ./.github/actions/native-toolchain

      - name: Compute cache key
        id: key
        run: |
          # The Xcode segment comes from config/toolchain.json so a pin bump starts a new cache namespace.
          xcode="$(python3 -c "import json; print(json.load(open('config/toolchain.json'))['native']['xcode']['version'])")"
          # The dependency graph only (audit W-04): project.yml is regenerated each run.
          graph="${{ hashFiles('QwenVoice.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Packages/VocelloQwen3Core/Package.resolved', 'Packages/VocelloQwen3Core/Package.swift') }}"
          # One entry per (Xcode, dependency graph, ISO week): a warm run hits it
          # exactly and saves nothing; the first run of a week or of a new graph
          # misses the exact key, restores the newest prefix match and saves once.
          week="$(date -u +%G-W%V)"
          echo "prefix=ios-xcode${xcode}-" >> "$GITHUB_OUTPUT"
          echo "graph=ios-xcode${xcode}-${graph}-" >> "$GITHUB_OUTPUT"
          echo "value=ios-xcode${xcode}-${graph}-${week}" >> "$GITHUB_OUTPUT"
          echo "spm=spm-${{ hashFiles('QwenVoice.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Packages/VocelloQwen3Core/Package.resolved') }}" >> "$GITHUB_OUTPUT"

      - name: Restore build caches
        id: cache
        if: ${{ !inputs.cold }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/cache/xcode/ios-device
          key: ${{ steps.key.outputs.value }}
          restore-keys: |
            ${{ steps.key.outputs.graph }}
            ${{ steps.key.outputs.prefix }}

      - name: Restore the shared package checkout
        id: spm
        if: ${{ !inputs.cold }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/cache/xcode/source-packages
          key: ${{ steps.key.outputs.spm }}

      - name: Restore tracked-file mtimes from history
        run: python3 scripts/ci/restore_mtimes.py

      - name: Regenerate Xcode project
        run: ./scripts/regenerate_project.sh --fast

      - name: Compile VocelloiOS and the iOS policy tests for the device SDK
        # Same script and same persistent DerivedData as the local checkpoint;
        # CODE_SIGNING_ALLOWED=NO inside the script. Compile only, no phone. A
        # compile check needs no optimized products, so CI keeps -Onone and the
        # arena stays incremental; the local checkpoint keeps -O for the device lanes.
        env:
          QVOICE_FOUNDATION_SWIFT_OPTIMIZATION: "-Onone"
        run: ./scripts/build_foundation_targets.sh ios --incremental

      - name: Compile the iOS XCUITest bundle for the device SDK (build only, never run)
        # PA-24: the same arena and settings as the compile above (unsigned,
        # -Onone), so only the UI-test target compiles. No phone, no runner.
        env:
          QVOICE_FOUNDATION_SWIFT_OPTIMIZATION: "-Onone"
        run: ./scripts/build_ui_test_bundles.sh ios --gate

      - name: Name the compile errors
        if: failure()
        run: python3 scripts/ci/summarize_test_failures.py --lane "iOS compile check" --root build/artifacts

      - name: Upload compile results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-compile-artifacts
          path: |
            build/artifacts/foundation/
            build/artifacts/ui-bundles/
          if-no-files-found: warn
          retention-days: 7

      - name: Prune caches before save
        if: always()
        run: |
          rm -rf build/cache/xcode/ios-device/Logs build/cache/xcode/ios-device/Index.noindex
          find build/cache/xcode/ios-device -name '*.xcactivitylog' -delete 2>/dev/null || true
          du -sh build/cache/xcode/ios-device build/cache/xcode/source-packages 2>/dev/null || true
          echo "restored from: ${{ steps.cache.outputs.cache-matched-key || 'nothing (cold)' }}"

      - name: Save build caches
        if: ${{ success() && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/cache/xcode/ios-device
          key: ${{ steps.key.outputs.value }}

      - name: Save the shared package checkout
        if: ${{ success() && steps.spm.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/cache/xcode/source-packages
          key: ${{ steps.key.outputs.spm }}

  website:
    name: Website deterministic checks
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Major-only pin (config/toolchain.json): the latest 24.x and its bundled npm 11.x.
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Validate website toolchain
        run: python3 scripts/supply_chain_contract.py --installed website

      - name: Install locked dependencies
        run: npm --prefix website ci

      - name: Install pinned Chromium runtime
        run: npx --prefix website playwright install --with-deps chromium

      - name: Lint, test, and build website
        run: npm --prefix website run check

  dependency-submission:
    name: Submit Swift dependency graph
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate deterministic Swift dependency snapshot
        run: |
          set -euo pipefail
          python3 scripts/swift_dependency_snapshot.py \
            --sha "$GITHUB_SHA" \
            --ref "$GITHUB_REF" \
            --job-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --job-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > "$RUNNER_TEMP/swift-dependency-snapshot.json"

      - name: Submit Swift dependency snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/${GITHUB_REPOSITORY}/dependency-graph/snapshots" \
            --input "$RUNNER_TEMP/swift-dependency-snapshot.json"

  ci-required:
    name: CI required
    needs: [changes, contracts, python, macos-tests, macos-tsan, ios-compile, website, dependency-submission]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # On a pull request the macOS jobs and the dependency submission are
      # skipped by event, so this aggregates the Linux lanes only.
      - name: Aggregate required results
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "pull request: Linux lanes only; the macOS lanes run on the push to main"
          fi
          if printf '%s' "$RESULTS" | grep -Eq '"result": *"(failure|cancelled)"'; then
            echo "::error::a required CI job failed or was cancelled"
            exit 1
          fi
          echo "all required jobs succeeded or were skipped by path routing"
