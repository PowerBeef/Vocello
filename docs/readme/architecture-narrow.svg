<svg xmlns="http://www.w3.org/2000/svg" width="400" height="968" viewBox="0 0 400 968" role="img" aria-labelledby="title desc">
<title id="title">How Vocello works</title>
<desc id="desc">The Mac app, the iPhone app and the vocello command line host one engine; the VocelloQwen3Engine actor runs the talker, code predictor and speech decoder on MLX and Metal; audio streams to the preview, a limiter, a watermarked WAV and an audio check before History.</desc>
