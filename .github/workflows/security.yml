name: Security

# Weekly and on-demand security analysis, and the exact-tag run release.yml
# calls before it authorizes a candidate. Not per push: Swift CodeQL rebuilds
# the whole graph and takes about an hour on a macos-26 runner, which is not a
# useful signal on every trunk commit. `Security required` remains the stable
# aggregate name.
on:
  schedule:
    - cron: '23 8 * * 2'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm-advisory-audit:
    name: npm advisory audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Select pinned npm
        run: npm install --global npm@11.12.1

      - name: Audit locked website dependencies
        run: npm --prefix website audit --package-lock-only --audit-level=high

  codeql:
    name: CodeQL (${{ matrix.language }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
            runner: ubuntu-latest
          - language: swift
            build-mode: manual
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Native toolchain
        if: matrix.language == 'swift'
        uses: ./.github/actions/native-toolchain
        with:
          metal: "true"

      - name: Prepare Swift CodeQL build inputs
        if: matrix.language == 'swift'
        run: |
          # Prebuild the full graph natively so Xcode 26's optional Metal
          # compiler materializes and validates MLX shader outputs in managed
          # CI scratch before CodeQL's translated tracing shell starts. The
          # traced command below reuses that scratch graph and invalidates only
          # repository-owned Swift sources.
          ./scripts/build.sh codeql-prepare

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build Swift targets for CodeQL
        if: matrix.language == 'swift'
        run: |
          # CodeQL's tracing shell currently runs through Rosetta on the ARM
          # macos-26 image. Keep the owned-Swift rebuild inside that shell so
          # the extractor sees it, while reusing native Metal/dependency outputs
          # and emitting only arm64 products through ARCHS=arm64. Neither
          # command stages public output.
          ./scripts/build.sh codeql

      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

  security-required:
    name: Security required
    needs: [npm-advisory-audit, codeql]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate security results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          if printf '%s' "$RESULTS" | grep -Eq '"result": *"(failure|cancelled)"'; then
            echo "::error::a security job failed or was cancelled"
            exit 1
          fi
          echo "all security jobs succeeded"
