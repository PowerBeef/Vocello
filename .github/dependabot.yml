version: 2
updates:
  # Action SHAs are pinned in lockstep with config/toolchain.json (supply_chain_contract.py);
  # keep version-update PRs disabled so Dependabot does not open unmergeable solo bumps.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Toronto"
    labels: ["dependencies", "ci"]
    open-pull-requests-limit: 0
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "America/Toronto"
    labels: ["dependencies", "website"]
    open-pull-requests-limit: 5
    groups:
      website-runtime:
        dependency-type: "production"
        patterns: ["*"]
      website-development:
        dependency-type: "development"
        patterns: ["*"]

  # The independently governed Qwen runtime is the repository's SwiftPM package root.
  # Exact Swift pins move only in lockstep with project.yml/COMPATIBILITY.json and benchmark review
  # (monitored weekly by .github/workflows/swift-dependency-watch.yml), so keep automated PRs off.
  - package-ecosystem: "swift"
    directory: "/Packages/VocelloQwen3Core"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "America/Toronto"
    labels: ["dependencies", "backend"]
    open-pull-requests-limit: 0
    groups:
      mlx-runtime:
        patterns: ["mlx-*"]
