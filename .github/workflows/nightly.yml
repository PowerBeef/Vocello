name: Nightly

# The cold and complete passes behind push CI: a cold run of the Thread
# Sanitizer subset (push CI's macos-tsan job runs it on its warm cache and has
# blocked every Swift push since 2026-09-14, config/tsan-policy.json), the
# complete Python suite including quarantined tests, and cold foundation
# compiles of both platforms. Failure opens (or refreshes) one issue labelled
# `nightly`; this workflow itself blocks no commit or push, and no retry is
# automatic.
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  tsan:
    name: Core TSan subset
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Native toolchain
        uses: ./.github/actions/native-toolchain
        with:
          metal: "true"

      - name: Run the Thread Sanitizer subset
        run: scripts/macos_test.sh tsan

      - name: Retain sanitizer evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tsan-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/artifacts/macos/tests/tsan-*/
          if-no-files-found: warn
          retention-days: 14

  python-full:
    name: Python suite (complete)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned numpy, pytest and ripgrep
        run: |
          set -euo pipefail
          NUMPY_PIN="$(python3 -c "import json; print(json.load(open('config/toolchain.json'))['native']['numpy']['version'])")"
          PYTEST_PIN="$(python3 -c "import json; print(json.load(open('config/toolchain.json'))['native']['pytest']['version'])")"
          XDIST_PIN="$(python3 -c "import json; print(json.load(open('config/toolchain.json'))['native']['pytest-xdist']['version'])")"
          python3 -m pip install --quiet --break-system-packages "numpy==${NUMPY_PIN}" "pytest==${PYTEST_PIN}" "pytest-xdist==${XDIST_PIN}"
          sudo apt-get install -y --no-install-recommends ripgrep

      - name: Run the complete Python suite
        run: python3 -m pytest -n auto

  foundation-cold:
    name: Cold foundation compile (macOS + iOS)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Native toolchain
        uses: ./.github/actions/native-toolchain

      - name: Regenerate Xcode project
        run: ./scripts/regenerate_project.sh --fast

      - name: Compile every foundation target from a clean tree
        run: ./scripts/build_foundation_targets.sh all

      - name: Compile the macOS app optimized (warnings are errors)
        env:
          QVOICE_FOUNDATION_SWIFT_OPTIMIZATION: "-O"
        run: ./scripts/build_foundation_targets.sh macos

      - name: Upload compile results on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundation-cold-artifacts
          path: build/artifacts/foundation/
          if-no-files-found: warn
          retention-days: 7

  report:
    name: Open or refresh the nightly issue
    needs: [tsan, python-full, foundation-cold]
    if: failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: File one issue per open nightly failure
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: ${{ toJSON(needs) }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/ci/failure_issue.py --label nightly --title "Nightly lane failing" --heading "Nightly run failed"
