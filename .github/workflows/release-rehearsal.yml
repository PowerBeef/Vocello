name: Release rehearsal

# Exercises the release path without secrets so it cannot rot between tags.
# The v2.4.0 tag (August 1) was the last run of release.yml; three separate
# toolchain pins broke it afterwards without anything noticing.
#
# The macOS jobs mirror release.yml's three. macos-package runs the same
# ledgered commands release.yml's package job runs (release.sh with its
# release-readiness gate, then the packaged-DMG and CLI verification) with
# ad-hoc signing and no notarization, and hands the DMG on with its digest.
# sparkle-feed, a fresh runner with only the pinned sign_update, signs the DMG
# and the feed with an ephemeral key (release.yml uses the `release`
# environment's key and verifies against the app's SUPublicEDKey). evidence
# re-verifies the feed and builds and validates the release evidence. Only
# workflow artifacts between those jobs and logs on failure are uploaded.
# Keychain import, notarization, stapling, attestation and the draft Release
# steps stay covered by ReleaseCredentialHygieneTests and the next tag.
on:
  schedule:
    - cron: '17 6 * * 3'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - .github/workflows/release-rehearsal.yml
      - .github/actions/**
      - scripts/release.sh
      - scripts/build*.sh
      - scripts/create_dmg.sh
      - scripts/verify_packaged_dmg.sh
      - scripts/verify_packaged_cli.sh
      - scripts/verify_release_bundle.sh
      - scripts/lib/release_signing.sh
      - scripts/sparkle_appcast.py
      - scripts/cli_package.py
      - scripts/release_evidence.py
      - scripts/release_build_number.py
      - scripts/release_sbom.py
      - scripts/required_step_ledger.py
      - scripts/install_pinned_*.sh
      - scripts/supply_chain_contract.py
      - scripts/lib/build_*.sh
      - config/toolchain.json
      - config/orchestration-contract.json
      - config/release-evidence-contract.json
      - config/build-output-policy.json
      - project.yml
      - ExportOptions*.plist
      - Sources/QwenVoice.entitlements

permissions:
  contents: read

concurrency:
  group: release-rehearsal-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-package:
    name: Rehearse macOS package (ad-hoc, not notarized)
    runs-on: macos-26
    timeout-minutes: 150
    outputs:
      tag: ${{ steps.bind.outputs.tag }}
      dmg_sha256: ${{ steps.digest.outputs.dmg_sha256 }}
    env:
      QWENVOICE_SIGNING_MODE: ad-hoc
      QWENVOICE_NOTARIZE: "0"
      RELEASE_SOURCE_IDENTITY: build/artifacts/macos/release/source-identity.json
      RELEASE_STEP_LEDGER: build/artifacts/macos/release/required-steps.json
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Roadmap and evidence validation read history.
          fetch-depth: 0
          persist-credentials: false

      - name: Install and validate pinned release toolchain
        uses: ./.github/actions/native-toolchain
        with:
          metal: "true"
          release-tools: "false"
          pip-cache: "false"

      - name: Bind rehearsal source and initialize required steps
        id: bind
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          version="$(python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          import release_evidence
          print(release_evidence.project_version(Path("."))[0])
          PY
          )"
          python3 scripts/release_build_number.py check --tag "v$version"
          python3 scripts/release_evidence.py capture-source-identity \
            --commit "$commit" --output "$RELEASE_SOURCE_IDENTITY"
          python3 scripts/required_step_ledger.py init \
            --ledger "$RELEASE_STEP_LEDGER" \
            --workflow release-macos-candidate \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --source-identity "$RELEASE_SOURCE_IDENTITY"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Run scripts/release.sh (ad-hoc rehearsal)
        run: |
          python3 scripts/required_step_ledger.py run \
            --ledger "$RELEASE_STEP_LEDGER" --step release-build \
            --timeout-seconds 7800 -- ./scripts/release.sh --preflight none

      - name: Verify packaged DMG and CLI
        run: |
          python3 scripts/required_step_ledger.py run \
            --ledger "$RELEASE_STEP_LEDGER" --step artifact-verification \
            --timeout-seconds 900 -- \
            ./scripts/verify_packaged_dmg.sh \
              build/dist/macos/Vocello-macos26.dmg \
              build/dist/macos/release-metadata.txt --include-cli

      - name: Record the verified DMG's digest
        id: digest
        run: |
          set -euo pipefail
          sha="$(shasum -a 256 build/dist/macos/Vocello-macos26.dmg | cut -d' ' -f1)"
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::could not digest the DMG"; exit 1; }
          echo "dmg_sha256=$sha" >> "$GITHUB_OUTPUT"

      - name: Upload the verified DMG for the Sparkle and evidence jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rehearsal-dmg
          path: build/dist/macos/Vocello-macos26.dmg
          if-no-files-found: error
          retention-days: 3

      - name: Upload the package outputs and step ledger for the evidence job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rehearsal-package
          path: |
            build/dist/macos/Vocello-macos26-cli.dmg
            build/dist/macos/cli-package-verification.json
            build/dist/macos/release-metadata.txt
            ${{ env.RELEASE_SOURCE_IDENTITY }}
            ${{ env.RELEASE_STEP_LEDGER }}
            build/artifacts/macos/release/steps/
          if-no-files-found: error
          retention-days: 3

      - name: Upload rehearsal logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-rehearsal-logs
          path: |
            build/artifacts/macos/release/
            build/artifacts/macos/release-readiness/
            build/artifacts/macos/tests/
          if-no-files-found: warn
          retention-days: 7

  # release.yml's sparkle-feed job with an ephemeral key: a fresh runner, the DMG checked
  # against macos-package's digest, only the pinned sign_update installed, and the same
  # standard-library command. The app must still carry a well-formed SUPublicEDKey and an
  # SUFeedURL that names appcast.xml.
  sparkle-feed:
    name: Rehearse the Sparkle signatures (ephemeral key)
    needs: macos-package
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      appcast_sha256: ${{ steps.sign.outputs.appcast_sha256 }}
      public_key: ${{ steps.sign.outputs.public_key }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the verified DMG
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rehearsal-dmg
          path: ${{ runner.temp }}/candidate

      - name: Check the DMG against the package job's digest
        id: candidate
        env:
          EXPECTED_SHA256: ${{ needs.macos-package.outputs.dmg_sha256 }}
        run: |
          set -euo pipefail
          dmg="$RUNNER_TEMP/candidate/Vocello-macos26.dmg"
          [ -f "$dmg" ] && [ ! -L "$dmg" ] || { echo "::error::the downloaded DMG is missing"; exit 1; }
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::the package job recorded no DMG digest"; exit 1; }
          [ "$(shasum -a 256 "$dmg" | cut -d' ' -f1)" = "$EXPECTED_SHA256" ] \
            || { echo "::error::the downloaded DMG is not the one the package job verified"; exit 1; }
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"
          echo "pub_date_epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install the pinned Sparkle signing tool
        id: sparkle
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/sparkle-tool"
          ./scripts/install_pinned_tools.sh --prefix "$prefix/bin" sparkle
          version="$(python3 -I -S -c 'import json, sys; print(json.load(open(sys.argv[1]))["artifactPins"]["sparkle"]["version"])' config/toolchain.json)"
          tool="$prefix/share/sparkle-$version/bin/sign_update"
          [ -f "$tool" ] && [ -x "$tool" ] || { echo "::error::sign_update is not where the installer puts it"; exit 1; }
          echo "sign_update=$tool" >> "$GITHUB_OUTPUT"

      - name: Rehearse the Sparkle signatures and appcast (ephemeral key)
        id: sign
        env:
          DMG: ${{ steps.candidate.outputs.dmg }}
          PUB_DATE_EPOCH: ${{ steps.candidate.outputs.pub_date_epoch }}
          SIGN_UPDATE: ${{ steps.sparkle.outputs.sign_update }}
          REHEARSAL_TAG: ${{ needs.macos-package.outputs.tag }}
        run: |
          set -euo pipefail
          SPARKLE_ED_PRIVATE_KEY="$(python3 -I -S -c 'import base64, os; print(base64.b64encode(os.urandom(32)).decode())')"
          export SPARKLE_ED_PRIVATE_KEY
          public_key="$(python3 -I -S scripts/sparkle_appcast.py public-key)"
          releases="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases"
          appcast="$RUNNER_TEMP/sparkle-feed/appcast.xml"
          python3 -I -S scripts/sparkle_appcast.py create \
            --dmg "$DMG" \
            --url "$releases/download/$REHEARSAL_TAG/$(basename "$DMG")" \
            --link "$releases" \
            --pub-date-epoch "$PUB_DATE_EPOCH" \
            --sign-update "$SIGN_UPDATE" \
            --public-key "$public_key" \
            --output "$appcast"
          echo "public_key=$public_key" >> "$GITHUB_OUTPUT"
          echo "appcast_sha256=$(shasum -a 256 "$appcast" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload the signed appcast for the evidence job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rehearsal-appcast
          path: ${{ runner.temp }}/sparkle-feed/appcast.xml
          if-no-files-found: error
          retention-days: 3

  # release.yml's draft-release job up to the evidence: the digests, a secret-free
  # re-check of the feed, and the release evidence built and validated, not published.
  evidence:
    name: Rehearse the release evidence (not published)
    needs: [macos-package, sparkle-feed]
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RELEASE_SOURCE_IDENTITY: build/artifacts/macos/release/source-identity.json
      RELEASE_STEP_LEDGER: build/artifacts/macos/release/required-steps.json
      REHEARSAL_TAG: ${{ needs.macos-package.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Roadmap and evidence validation read history.
          fetch-depth: 0
          persist-credentials: false

      # Unused here, but release.yml's draft-release job installs it the same way, so a
      # broken gh pin fails the rehearsal rather than the next tag.
      - name: Install the pinned release tool gh
        run: |
          set -euo pipefail
          ./scripts/install_pinned_tools.sh gh
          PATH="$HOME/.qwenvoice-pinned-tools/bin:$PATH" python3 scripts/supply_chain_contract.py --installed release

      - name: Download the package outputs and step ledger
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rehearsal-package
          path: build

      - name: Download the verified DMG
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rehearsal-dmg
          path: build/dist/macos

      - name: Download the signed appcast
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rehearsal-appcast
          path: build/dist/macos

      - name: Check the DMG and appcast digests and re-verify the feed
        env:
          DMG_SHA256: ${{ needs.macos-package.outputs.dmg_sha256 }}
          APPCAST_SHA256: ${{ needs.sparkle-feed.outputs.appcast_sha256 }}
          PUBLIC_KEY: ${{ needs.sparkle-feed.outputs.public_key }}
        run: |
          set -euo pipefail
          dmg=build/dist/macos/Vocello-macos26.dmg
          appcast=build/dist/macos/appcast.xml
          [[ "$DMG_SHA256" =~ ^[0-9a-f]{64}$ && "$APPCAST_SHA256" =~ ^[0-9a-f]{64}$ ]] \
            || { echo "::error::an earlier job recorded no digest"; exit 1; }
          [ "$(shasum -a 256 "$dmg" | cut -d' ' -f1)" = "$DMG_SHA256" ] \
            || { echo "::error::the DMG is not the one the package job verified"; exit 1; }
          [ "$(shasum -a 256 "$appcast" | cut -d' ' -f1)" = "$APPCAST_SHA256" ] \
            || { echo "::error::appcast.xml is not the one the Sparkle job signed"; exit 1; }
          releases="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases"
          python3 -I -S scripts/sparkle_appcast.py verify \
            --dmg "$dmg" \
            --appcast "$appcast" \
            --url "$releases/download/$REHEARSAL_TAG/Vocello-macos26.dmg" \
            --public-key "$PUBLIC_KEY"

      - name: Build and validate release evidence (not published)
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          python3 scripts/required_step_ledger.py finalize --ledger "$RELEASE_STEP_LEDGER"
          python3 scripts/release_evidence.py create \
            --allow-missing-tag-ref \
            --tag "$REHEARSAL_TAG" \
            --commit "$commit" \
            --platform macos \
            --source-date-epoch "$(git show -s --format=%ct "$commit")" \
            --output-dir build/dist/macos \
            --artifact build/dist/macos/Vocello-macos26.dmg \
            --artifact build/dist/macos/Vocello-macos26-cli.dmg \
            --artifact build/dist/macos/cli-package-verification.json \
            --artifact build/dist/macos/appcast.xml \
            --metadata build/dist/macos/release-metadata.txt \
            --source-identity "$RELEASE_SOURCE_IDENTITY" \
            --step-ledger "$RELEASE_STEP_LEDGER"
          python3 scripts/release_evidence.py validate --output-dir build/dist/macos

      - name: Upload rehearsal evidence logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-rehearsal-evidence-logs
          path: build/artifacts/macos/release/
          if-no-files-found: warn
          retention-days: 7

  ios-release-prerequisites:
    name: Rehearse iOS archive prerequisites
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install and validate pinned release toolchain
        uses: ./.github/actions/native-toolchain
        with:
          metal: "true"
          release-tools: "false"
          pip-cache: "false"

      - name: Regenerate Xcode project
        run: ./scripts/regenerate_project.sh

      - name: Resolve SwiftPM dependencies the way archive-ios does
        run: |
          set -euo pipefail
          python3 scripts/lib/ios_platform_preflight.py check
          mkdir -p build/cache/xcode/source-packages build/scratch/derived-data/ci/ios-archive
          xcodebuild -resolvePackageDependencies \
            -project QwenVoice.xcodeproj \
            -scheme VocelloiOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath build/cache/xcode/source-packages \
            -derivedDataPath build/scratch/derived-data/ci/ios-archive \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile

      - name: Validate the bundled iOS model catalog
        run: ./scripts/check_ios_catalog.sh

      # release.yml's archive-ios uploads with `xcrun altool --upload-app ... -t ios
      # --apiKey --apiIssuer`; confirm the pinned Xcode still ships that command and
      # those options, without credentials (PA-05).
      - name: Confirm the pinned Xcode supports the TestFlight upload command
        run: |
          set -euo pipefail
          help="$(xcrun altool --help 2>&1 || true)"
          for option in --upload-app --apiKey --apiIssuer; do
            if ! grep -q -- "$option" <<<"$help"; then
              echo "::error::xcrun altool in the pinned Xcode does not list $option (release.yml TestFlight upload)"
              exit 1
            fi
          done
          echo "altool supports --upload-app with API-key authentication: $(xcrun altool --version 2>&1 | tail -1)"

  report:
    name: Open or refresh the rehearsal issue
    needs: [macos-package, sparkle-feed, evidence, ios-release-prerequisites]
    if: failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: File one issue per open rehearsal failure
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: ${{ toJSON(needs) }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/ci/failure_issue.py --label release-rehearsal --title "Release rehearsal failing" --heading "Release rehearsal failed"
