name: CI

# Push CI for Vocello (QwenVoice). Trunk-based: every push to main runs here and
# `CI required` is the single branch-protection context (skipped counts as pass).
#
# Lanes are routed by scripts/ci/classify_changes.py; an unknowable diff runs
# everything. Native jobs restore the persistent DerivedData caches the local
# scripts already use (config/build-output-policy.json), so a warm push
# recompiles only what changed. Dispatch with `cold: true` to skip the restore.
#
# Ordinary CI is UI-free: no XCUITest, no Simulator, no device, no model.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cold:
        description: Skip the DerivedData cache restore (full rebuild)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Change routing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      swift: ${{ steps.classify.outputs.swift }}
      ios: ${{ steps.classify.outputs.ios }}
      python: ${{ steps.classify.outputs.python }}
      research: ${{ steps.classify.outputs.research }}
      website: ${{ steps.classify.outputs.website }}
      workflows: ${{ steps.classify.outputs.workflows }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Each lane is diffed against the last run on this branch in which its job
      # passed, so a run cancelled by a superseding push cannot leave a lane
      # unrun behind a later docs-only push. Best effort: without history the
      # classifier falls back to the previous push, then to every lane.
      - name: Recent runs of this workflow on this branch
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > ci-history.json
          ids="$(gh run list --workflow ci.yml --branch "$GITHUB_REF_NAME" --limit 15 \
            --json databaseId,status --jq '.[] | select(.status == "completed") | .databaseId' || true)"
          python3 - $ids <<'PY' > ci-history.json
          import json, subprocess, sys
          runs = []
          for run_id in sys.argv[1:]:
              view = subprocess.run(
                  ["gh", "run", "view", run_id, "--json", "headSha,conclusion,jobs"],
                  capture_output=True, text=True, check=False,
              )
              if view.returncode:
                  continue
              payload = json.loads(view.stdout)
              runs.append({
                  "headSha": payload.get("headSha"),
                  "conclusion": payload.get("conclusion"),
                  "jobs": {job.get("name"): job.get("conclusion") for job in payload.get("jobs", [])},
              })
          json.dump(runs, sys.stdout)
          PY
          echo "history: $(python3 -c 'import json,sys; print(len(json.load(open("ci-history.json"))))' 2>/dev/null || echo 0) completed run(s)"

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          CI_HISTORY_PATH: ci-history.json
        run: python3 scripts/ci/classify_changes.py

  contracts:
    name: Repository contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # roadmap.py resolves evidence commits against history.
          fetch-depth: 0

      - name: Install ripgrep
        run: sudo apt-get install -y --no-install-recommends ripgrep

      - name: Pinned actions, Dependabot coverage, website scripts
        run: python3 scripts/supply_chain_contract.py

      - name: Product invariants and privacy scan
        run: |
          set -euo pipefail
          scripts/repo_invariants.sh
          python3 scripts/privacy_scan.py

      - name: Work authority
        run: |
          set -euo pipefail
          python3 scripts/roadmap.py validate
          python3 scripts/roadmap.py render --check

  # The Python suite on Linux. Modules that need the macOS host (benchmark
  # record publication binds Mac hardware) carry explicit skips and still run
  # inside the macOS gate.
  python:
    name: Python tests (linux)
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pinned numpy, pytest and ripgrep
        run: |
          set -euo pipefail
          NUMPY_PIN="$(python3 -c "import json; print(json.load(open('config/toolchain.json'))['native']['numpy']['version'])")"
          PYTEST_PIN="$(python3 -c "import json; print(json.load(open('config/toolchain.json'))['native']['pytest']['version'])")"
          XDIST_PIN="$(python3 -c "import json; print(json.load(open('config/toolchain.json'))['native']['pytest-xdist']['version'])")"
          python3 -m pip install --quiet --break-system-packages "numpy==${NUMPY_PIN}" "pytest==${PYTEST_PIN}" "pytest-xdist==${XDIST_PIN}"
          sudo apt-get install -y --no-install-recommends ripgrep

      - name: Product and tooling tests
        env:
          VOCELLO_QUARANTINE: "1"
        run: python3 -m pytest -n auto -m "not research and not darwin_only"

      - name: Research tooling tests
        if: needs.changes.outputs.research == 'true' || needs.changes.outputs.workflows == 'true'
        env:
          VOCELLO_QUARANTINE: "1"
        run: python3 -m pytest -n auto -m research

  macos-tests:
    name: macOS deterministic tests
    needs: changes
    if: needs.changes.outputs.swift == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Native toolchain
        uses: ./.github/actions/native-toolchain

      - name: Compute cache key
        id: key
        run: |
          # The Xcode segment comes from config/toolchain.json so a pin bump starts a new cache namespace.
          xcode="$(python3 -c "import json; print(json.load(open('config/toolchain.json'))['native']['xcode']['version'])")"
          graph="${{ hashFiles('QwenVoice.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Packages/VocelloQwen3Core/Package.resolved', 'Packages/VocelloQwen3Core/Package.swift', 'project.yml') }}"
          echo "prefix=macos-xcode${xcode}-" >> "$GITHUB_OUTPUT"
          echo "graph=macos-xcode${xcode}-${graph}-" >> "$GITHUB_OUTPUT"
          echo "value=macos-xcode${xcode}-${graph}-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Restore build caches
        id: cache
        if: ${{ !inputs.cold }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/cache/xcode/macos
            build/cache/xcode/source-packages
            build/cache/swiftpm/mlx-audio-runtime
          key: ${{ steps.key.outputs.value }}
          restore-keys: |
            ${{ steps.key.outputs.graph }}
            ${{ steps.key.outputs.prefix }}

      - name: Restore tracked-file mtimes from history
        run: python3 scripts/ci/restore_mtimes.py

      - name: Regenerate Xcode project
        run: ./scripts/regenerate_project.sh --fast

      - name: Check project inputs (darwin-only Python modules)
        env:
          VOCELLO_QUARANTINE: "1"
        run: ./scripts/check_project_inputs.sh --python darwin-only

      - name: Run deterministic macOS tests
        env:
          VOCELLO_QUARANTINE: "1"
        run: scripts/macos_test.sh test

      - name: Verify source-built CLI version identity
        run: ./scripts/build.sh cli --version

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-deterministic-test-artifacts
          path: build/artifacts/macos/tests/
          if-no-files-found: warn
          retention-days: 7

      - name: Prune caches before save
        if: always()
        run: |
          rm -rf build/cache/xcode/macos/Logs build/cache/xcode/macos/Index.noindex
          find build/cache/xcode/macos -name '*.xcactivitylog' -delete 2>/dev/null || true
          du -sh build/cache/xcode/macos build/cache/xcode/source-packages build/cache/swiftpm/mlx-audio-runtime 2>/dev/null || true
          echo "restored from: ${{ steps.cache.outputs.cache-matched-key || 'nothing (cold)' }}"

      - name: Save build caches
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/cache/xcode/macos
            build/cache/xcode/source-packages
            build/cache/swiftpm/mlx-audio-runtime
          key: ${{ steps.key.outputs.value }}

  ios-compile:
    name: iOS compile check (device SDK)
    needs: changes
    if: needs.changes.outputs.ios == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Native toolchain
        uses: ./.github/actions/native-toolchain

      - name: Compute cache key
        id: key
        run: |
          # The Xcode segment comes from config/toolchain.json so a pin bump starts a new cache namespace.
          xcode="$(python3 -c "import json; print(json.load(open('config/toolchain.json'))['native']['xcode']['version'])")"
          graph="${{ hashFiles('QwenVoice.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Packages/VocelloQwen3Core/Package.resolved', 'Packages/VocelloQwen3Core/Package.swift', 'project.yml') }}"
          echo "prefix=ios-xcode${xcode}-" >> "$GITHUB_OUTPUT"
          echo "graph=ios-xcode${xcode}-${graph}-" >> "$GITHUB_OUTPUT"
          echo "value=ios-xcode${xcode}-${graph}-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Restore build caches
        id: cache
        if: ${{ !inputs.cold }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/cache/xcode/ios-device
            build/cache/xcode/source-packages
          key: ${{ steps.key.outputs.value }}
          restore-keys: |
            ${{ steps.key.outputs.graph }}
            ${{ steps.key.outputs.prefix }}

      - name: Restore tracked-file mtimes from history
        run: python3 scripts/ci/restore_mtimes.py

      - name: Regenerate Xcode project
        run: ./scripts/regenerate_project.sh --fast

      - name: Compile VocelloiOS and the iOS policy tests for the device SDK
        # Same script and same persistent DerivedData as the local checkpoint;
        # CODE_SIGNING_ALLOWED=NO inside the script. Compile only, no phone.
        run: ./scripts/build_foundation_targets.sh ios --incremental

      - name: Upload compile results on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-compile-artifacts
          path: build/artifacts/foundation/
          if-no-files-found: warn
          retention-days: 7

      - name: Prune caches before save
        if: always()
        run: |
          rm -rf build/cache/xcode/ios-device/Logs build/cache/xcode/ios-device/Index.noindex
          find build/cache/xcode/ios-device -name '*.xcactivitylog' -delete 2>/dev/null || true
          du -sh build/cache/xcode/ios-device build/cache/xcode/source-packages 2>/dev/null || true
          echo "restored from: ${{ steps.cache.outputs.cache-matched-key || 'nothing (cold)' }}"

      - name: Save build caches
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/cache/xcode/ios-device
            build/cache/xcode/source-packages
          key: ${{ steps.key.outputs.value }}

  website:
    name: Website deterministic checks
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Select pinned npm
        run: npm install --global npm@11.12.1

      - name: Validate website toolchain
        run: python3 scripts/supply_chain_contract.py --installed website

      - name: Install locked dependencies
        run: npm --prefix website ci

      - name: Install pinned Chromium runtime
        run: npx --prefix website playwright install --with-deps chromium

      - name: Lint, test, and build website
        run: npm --prefix website run check

  dependency-submission:
    name: Submit Swift dependency graph
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate deterministic Swift dependency snapshot
        run: |
          set -euo pipefail
          python3 scripts/swift_dependency_snapshot.py \
            --sha "$GITHUB_SHA" \
            --ref "$GITHUB_REF" \
            --job-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --job-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > "$RUNNER_TEMP/swift-dependency-snapshot.json"

      - name: Submit Swift dependency snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/${GITHUB_REPOSITORY}/dependency-graph/snapshots" \
            --input "$RUNNER_TEMP/swift-dependency-snapshot.json"

  ci-required:
    name: CI required
    needs: [changes, contracts, python, macos-tests, ios-compile, website, dependency-submission]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate required results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          if printf '%s' "$RESULTS" | grep -Eq '"result": *"(failure|cancelled)"'; then
            echo "::error::a required CI job failed or was cancelled"
            exit 1
          fi
          echo "all required jobs succeeded or were skipped by path routing"
